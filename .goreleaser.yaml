version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: watermill-coordinator
    main: ./cmd/coordinator
    binary: coordinator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive-sboms
    artifacts: archive

signs:
  - id: checksum-signature
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers_v2:
  - id: watermill-coordinator
    images:
      - "ghcr.io/magnusp/watermill-coordinator"
    tags:
      - "{{ .Version }}"
      - "v{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Watermill distributed transaction coordinator with SQLite/sqld"
      org.opencontainers.image.source: "https://github.com/magnusp/watermill-coordinator"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"
    platforms:
      - linux/amd64
      - linux/arm64


changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: "Features"
      regexp: '^.*feat[(\w\s)]*:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix[(\w\s)]*:'
      order: 1
    - title: "Security Updates"
      regexp: '^.*sec[(\w\s)]*:'
      order: 2
    - title: "Others"
      order: 999
