name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"

      - name: Install mise (for golangci-lint and govulncheck)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...

      - name: Fuzz test
        run: |
          go test -v -fuzz=FuzzParseTursoHostname -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzResolveDriverAndDSN -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzValidateTopic -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzJSONDecoders -fuzztime=2s ./pkg/coordinator

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Vulnerability scan
        run: govulncheck ./...
