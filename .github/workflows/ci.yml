name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install mise (for golangci-lint and govulncheck)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...

      - name: Fuzz test
        run: |
          go test -v -fuzz=FuzzParseTursoHostname -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzResolveDriverAndDSN -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzValidateTopic -fuzztime=2s ./pkg/coordinator
          go test -v -fuzz=FuzzJSONDecoders -fuzztime=2s ./pkg/coordinator

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Vulnerability scan
        run: govulncheck ./...
