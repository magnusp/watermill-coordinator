syntax = "proto3";

package io.cloudevents.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/magnusp/watermill-coordinator/proto;coordinatorpb";
option java_package = "io.cloudevents.v1.proto";
option java_multiple_files = true;

message CloudEvent {
  // Unique event identifier
  string id = 1;

  // URI-reference identifying the context producer
  string source = 2;

  // Version of the CloudEvents specification (e.g. "1.0")
  string spec_version = 3;

  // Event type identifier
  string type = 4;

  // Optional & extension attributes
  map<string, CloudEventAttributeValue> attributes = 5;

  // Event payload
  oneof data {
    bytes binary_data = 6;
    string text_data = 7;
    google.protobuf.Any proto_data = 8;
  }
}

message CloudEventBatch {
  repeated CloudEvent events = 1;
}

message CloudEventAttributeValue {
  oneof attr {
    bool ce_boolean = 1;
    int32 ce_integer = 2;
    string ce_string = 3;
    bytes ce_bytes = 4;
    string ce_uri = 5;
    string ce_uri_ref = 6;
    google.protobuf.Timestamp ce_timestamp = 7;
  }
}
